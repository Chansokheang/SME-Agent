# Gagesite on a Linux server (see docs/DEPLOY.md).
#
# Host networking: Gagesite starts website previews (ports 3100+) and their APIs (4100+) while it
# works, and shows them at http://localhost:<port>. On the host's network those ports are the
# server's own, so an SSH tunnel (scripts/tunnel.ps1) brings all of them to your computer. It also
# avoids Docker's default network, which on some servers can't look up addresses.
#
# Nothing listens on the internet: BIND_HOST=127.0.0.1 (the default) keeps Gagesite on the server
# itself. Gagesite has no sign-in, so keep it that way unless you know who can reach the server.
name: gagesite

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
      args:
        UID: ${GAGESITE_UID:-1000}
        DOCKER_GID: ${DOCKER_GID:-998}
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BIND_HOST: ${BIND_HOST:-127.0.0.1}
      PUBLIC_PORT: ${PUBLIC_PORT:-9021}
      TUNNEL_APP_METRICS: ${TUNNEL_APP_METRICS:-29021}
      TUNNEL_PREVIEW_METRICS: ${TUNNEL_PREVIEW_METRICS:-29022}
      TUNNEL_API_METRICS: ${TUNNEL_API_METRICS:-29023}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    volumes:
      - ./data:/data                                 # the database, the encryption key, every project
      - claude-home:/home/builder/.claude            # Claude Code's own files (conversations)
      - /var/run/docker.sock:/var/run/docker.sock    # APIs put on "this computer" run on the host's Docker

  web:
    build:
      context: ./web
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8001}
        NEXT_PUBLIC_PREVIEW_PORT: ${PREVIEW_PORT:-9022}
        NEXT_PUBLIC_API_PORT: ${API_PORT:-9023}
    network_mode: host
    restart: unless-stopped
    environment:
      HOSTNAME: ${BIND_HOST:-127.0.0.1}
      PORT: "3000"
    depends_on:
      - backend

  # Opened from the internet, with a password (COMPOSE_PROFILES=public in .env). Gagesite stays on
  # 127.0.0.1; Caddy answers on PUBLIC_PORT (Gagesite), PREVIEW_PORT (website previews) and
  # API_PORT (the previews' own APIs and their docs), and lets a request through only with a session from the sign-in page (backend/app/access.py).
  public:
    image: caddy:2.8.4-alpine
    profiles: ["public"]
    network_mode: host
    restart: unless-stopped
    environment:
      PUBLIC_PORT: ${PUBLIC_PORT:-9021}
      PREVIEW_PORT: ${PREVIEW_PORT:-9022}
      API_PORT: ${API_PORT:-9023}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - web

  # Public links when the server's ports can't be reached from the internet (a university or office
  # network): COMPOSE_PROFILES=public,tunnel in .env. Each tunnel gives a free, random
  # https://<words>.trycloudflare.com link to one of Caddy's ports (no Cloudflare account, nothing
  # opened in the firewall); the links change whenever the tunnels restart. The backend reads them
  # from each tunnel's local status port. Show them with: docker compose logs tunnel-app tunnel-preview tunnel-api
  tunnel-app:
    image: cloudflare/cloudflared:2025.4.0
    profiles: ["tunnel"]
    network_mode: host
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --metrics 127.0.0.1:${TUNNEL_APP_METRICS:-29021} --url http://127.0.0.1:${PUBLIC_PORT:-9021}
    depends_on:
      - public

  tunnel-preview:
    image: cloudflare/cloudflared:2025.4.0
    profiles: ["tunnel"]
    network_mode: host
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --metrics 127.0.0.1:${TUNNEL_PREVIEW_METRICS:-29022} --url http://127.0.0.1:${PREVIEW_PORT:-9022}
    depends_on:
      - public

  tunnel-api:
    image: cloudflare/cloudflared:2025.4.0
    profiles: ["tunnel"]
    network_mode: host
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --metrics 127.0.0.1:${TUNNEL_API_METRICS:-29023} --url http://127.0.0.1:${API_PORT:-9023}
    depends_on:
      - public

volumes:
  claude-home:
